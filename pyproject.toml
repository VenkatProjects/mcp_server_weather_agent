[project]
name = "weatheragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27.0",
    "httpx",
    "langchain-groq>=1.1.2",
    "python-dotenv>=1.2.2",
    "mcp-use>=1.7.0",
    "joserfc",
]

[project.scripts]
weather = "server.weather:run_server"

[tool.setuptools.packages.find]
include = ["server*"]
exclude = ["assets*"]

[tool.uv]
package = true
